<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Box Editor</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f4f7f6;
            --editor-bg-color: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .editor-header {
            text-align: center;
        }
        .editor-main {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-container {
            position: relative;
            max-width: 800px;
            flex-grow: 1;
            min-width: 300px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #video-player {
            width: 100%;
            display: block;
        }
        #preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
                 .timeline-container {
             width: 100%;
             padding: 10px 0;
         }
         #timeline-slider {
             width: 100%;
         }
         .timeline-controls {
             margin-top: 10px;
             display: flex;
             align-items: center;
             gap: 10px;
         }
         .timeline-controls input[type="number"] {
             width: 60px;
             padding: 3px;
         }
        .controls {
            background-color: var(--editor-bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .instructions {
            font-size: 0.8em;
            color: #666;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .slider-group {
            display: grid;
            grid-template-columns: 50px 1fr 60px; /* Adjusted for number input */
            align-items: center;
            gap: 10px;
        }
        input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        input[type="range"] { width: 100%; }
        .navigation { display: flex; justify-content: space-between; gap: 10px; }
        .extra-controls { margin-top: 10px; }
        .step-control { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #357abd; }
        #finish-btn { background-color: #28a745; }
        #finish-btn:hover:not(:disabled) { background-color: #218838; }
        #merge-btn { background-color: #fd7e14; }
        #merge-btn:hover:not(:disabled) { background-color: #e86a07; }
        #reset-btn, #not-sub-btn { background-color: #6c757d; }
        #reset-btn:hover:not(:disabled), #not-sub-btn:hover:not(:disabled) { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-header">
            <h1>Subtitle Box Editor</h1>
            <h3 id="interval-info">Loading...</h3>
        </div>
        <div class="editor-main">
            <div class="preview-container">
                <video id="video-player" controls></video>
                <canvas id="preview-canvas"></canvas>
            </div>
            <div class="controls">
                <div class="timeline-container">
                    <label for="timeline-slider">Timeline:</label>
                    <input type="range" id="timeline-slider" value="0" step="1" min="0" max="1000">
                    <span id="current-frame-display">Frame: 0</span>
                    <div class="timeline-controls">
                        <label>Timeline Step: <input type="number" id="timeline-step-input" value="1" min="1" max="100"></label>
                    </div>
                </div>
                <div class="interval-controls">
                    <label>Start Frame: <input type="number" id="start-frame-input"></label>
                    <label>End Frame: <input type="number" id="end-frame-input"></label>
                </div>

                <div class="instructions">
                    <p><b>How to adjust:</b></p>
                    <ul>
                        <li><b>Move Up/Down:</b> Decrease/Increase Y</li>
                        <li><b>Move Left/Right:</b> Decrease/Increase X</li>
                        <li><b>Shrink/Grow Vertically:</b> Decrease/Increase Height</li>
                        <li><b>Shrink/Grow Horizontally:</b> Decrease/Increase Width</li>
                    </ul>
                </div>
                <div class="slider-group">
                    <label for="x-slider">X:</label>
                    <input type="range" id="x-slider" name="x">
                    <input type="number" id="x-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="y-slider">Y:</label>
                    <input type="range" id="y-slider" name="y">
                    <input type="number" id="y-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="width-slider">Width:</label>
                    <input type="range" id="width-slider" name="width">
                    <input type="number" id="width-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="height-slider">Height:</label>
                    <input type="range" id="height-slider" name="height">
                    <input type="number" id="height-value" class="value-input">
                </div>
                <div class="step-control">
                    <label for="step-input">Step:</label>
                    <input type="number" id="step-input" value="10" min="1" style="width: 60px;">
                </div>
                <div class="navigation">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
                <div class="extra-controls">
                    <button id="use-last-btn" style="width: 100%;">Use Previous Box</button>
                </div>
                <div class="extra-controls">
                    <button id="reset-btn" style="width: 100%;">Reset Current Box</button>
                </div>
                <div class="extra-controls">
                    <button id="not-sub-btn" style="width: 100%;">Not a Subtitle</button>
                </div>
                <div class="extra-controls">
                    <button id="merge-btn" style="width: 100%;">Merge Similar Boxes</button>
                </div>
                <div class="extra-controls">
                    <button id="merge-prev-btn" style="width: 100%;">Merge with Previous</button>
                </div>
                <div class="extra-controls">
                    <button id="split-interval-btn" style="width: 100%;">Split Current Interval</button>
                </div>
                <button id="finish-btn">Finish and Process</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. INITIALIZATION ---
        // Get the unique task ID from the URL (e.g., /editor/some-uuid-goes-here)
        const taskId = window.location.pathname.split('/').pop();
        
        // Global variables to hold the state of the editor
        let intervals = []; // All subtitle intervals from the server
        let originalIntervals = []; // A pristine copy of the intervals for the "reset" feature
        let taskInfo = {};  // Video metadata like width and height
        let currentIntervalIdx = 0; // The index of the interval we are currently editing
        let debounceTimer; // A timer to prevent spamming the API while moving sliders
        let currentImage = new Image(); // An image object to hold the current raw video frame
        let isUserScrubbing = false; // Flag to track when user is manually scrubbing timeline
        let isUpdated = false;

        // Get references to all the HTML elements we will interact with
        const video = document.getElementById('video-player');
        const timeline = document.getElementById('timeline-slider');
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const intervalInfo = document.getElementById('interval-info');
        const currentFrameDisplay = document.getElementById('current-frame-display');
        const startFrameInput = document.getElementById('start-frame-input');
        const endFrameInput = document.getElementById('end-frame-input');
        const timelineStepInput = document.getElementById('timeline-step-input');
        const sliders = {
            x: document.getElementById('x-slider'),
            y: document.getElementById('y-slider'),
            width: document.getElementById('width-slider'),
            height: document.getElementById('height-slider')
        };
        const values = {
            x: document.getElementById('x-value'),
            y: document.getElementById('y-value'),
            width: document.getElementById('width-value'),
            height: document.getElementById('height-value')
        };
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');
        const useLastBtn = document.getElementById('use-last-btn');
        const stepInput = document.getElementById('step-input');
        const mergeBtn = document.getElementById('merge-btn');
        const resetBtn = document.getElementById('reset-btn');
        const notSubBtn = document.getElementById('not-sub-btn');
        const mergePrevBtn = document.getElementById('merge-prev-btn');
        const splitIntervalBtn = document.getElementById('split-interval-btn');

        // This is the main function that runs when the page loads.
        async function initializeEditor() {
            try {
                const [intervalsResponse, infoResponse] = await Promise.all([
                    fetch(`/subtitle_intervals/${taskId}`),
                    fetch(`/task_info/${taskId}`)
                ]);
                const intervalsData = await intervalsResponse.json();
                const infoData = await infoResponse.json();
                
                intervals = intervalsData.intervals;
                originalIntervals = JSON.parse(JSON.stringify(intervalsData.intervals));
                taskInfo = infoData;
                
                updateSliderSteps();
                
                // Setup video player
                video.src = `/stream_video/${taskId}`;
                video.onloadedmetadata = () => {
                    // Get actual video properties
                    taskInfo.fps = video.videoWidth > 0 ? video.getVideoPlaybackQuality().totalVideoFrames / video.duration : 30;
                    if (!taskInfo.fps || isNaN(taskInfo.fps)) {
                        taskInfo.fps = intervals.length > 1 ? (intervals[intervals.length-1].frame_range[1] / video.duration) : 30;
                    }
                    
                    // Set timeline max to actual total frames for full video playback
                    const totalFrames = Math.floor(video.duration * taskInfo.fps);
                    timeline.max = totalFrames;
                    timeline.step = parseInt(timelineStepInput.value) || 1;
                    loadInterval(0);
                    requestAnimationFrame(drawLoop);
                };

            } catch (error) {
                console.error("Failed to initialize editor:", error);
                intervalInfo.textContent = "Error loading task. Please try again.";
            }
        }

        function getCurrentFrame() {
            return Math.floor(video.currentTime * taskInfo.fps);
        }

        function findActiveInterval(frame) {
            return intervals.findIndex(i => frame >= i.frame_range[0] && frame <= i.frame_range[1]);
        }

        function setTimelinePosition(frame) {
            // Helper function to manually set timeline position
            isUserScrubbing = true;
            isUpdated = true;
            timeline.value = frame;
            video.currentTime = frame / taskInfo.fps;
            currentFrameDisplay.textContent = `Frame: ${frame}`;
            // Clear any existing timeout to prevent race conditions
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        }

        // --- CORE EDITOR LOGIC ---
        function loadInterval(idx, fromTimeline = false, goToEnd = false) {
            clearTimeout(debounceTimer);
            
            // Ensure valid index
            if (idx < 0) idx = 0;
            if (idx >= intervals.length) idx = intervals.length - 1;
            
            currentIntervalIdx = idx;
            const interval = intervals[idx];

            if (!fromTimeline) {
                const targetFrame = goToEnd ? interval.frame_range[1] : interval.frame_range[0];
                setTimelinePosition(targetFrame);
            }

            intervalInfo.textContent = `Editing Interval ${idx + 1} / ${intervals.length} (Frames ${interval.frame_range[0]}-${interval.frame_range[1]})`;
            startFrameInput.value = interval.frame_range[0];
            endFrameInput.value = interval.frame_range[1];
            
            const [xmin, xmax, ymin, ymax] = interval.coords;
            const currentBox = {
                x: xmin,
                y: ymin,
                width: xmax - xmin,
                height: ymax - ymin
            };

            updateSliderRanges();
            updateSliderValues(currentBox);

            // Always enable navigation buttons - let the click handlers deal with bounds
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            useLastBtn.disabled = currentIntervalIdx === 0;
            mergeBtn.disabled = false; // Always enabled
            mergePrevBtn.disabled = currentIntervalIdx === 0; // Can't merge with previous if first interval
            splitIntervalBtn.disabled = false; // Always enabled
        }
        
        function updateSliderRanges() {
            sliders.x.max = taskInfo.video_width;
            sliders.y.max = taskInfo.video_height;
            sliders.width.max = taskInfo.video_width;
            sliders.height.max = taskInfo.video_height;
        }
        
        function updateSliderValues(box) {
            for (const key in sliders) {
                sliders[key].value = box[key];
                values[key].value = box[key];
            }
        }

        // --- RENDERING AND PREVIEW ---
        function drawLoop() {
            // Match canvas size to video element size for correct scaling
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentFrame = getCurrentFrame();
            
            // Only update timeline if video is playing AND user is not manually scrubbing
            // This prevents the drawLoop from interfering with manual timeline scrubbing
            if (!video.paused && !isUserScrubbing) {
                timeline.value = currentFrame;
                currentFrameDisplay.textContent = `Frame: ${currentFrame}`;
            }

            const activeIdx = findActiveInterval(currentFrame);
            if (activeIdx !== -1) {
                if(activeIdx !== currentIntervalIdx && !isUserScrubbing) {
                    loadInterval(activeIdx, true);
                }
                const [xmin, xmax, ymin, ymax] = intervals[activeIdx].coords;
                const box = { x: xmin, y: ymin, width: xmax - xmin, height: ymax - ymin };
                drawBoundingBox(box);
            } else {
                // Clear canvas if no active interval
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            requestAnimationFrame(drawLoop);
        }

        function drawBoundingBox(box) {
            // Scale box coordinates from original video dimensions to displayed video dimensions
            const scaleX = canvas.width / taskInfo.video_width;
            const scaleY = canvas.height / taskInfo.video_height;
            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 2;
            ctx.strokeRect(box.x * scaleX, box.y * scaleY, box.width * scaleX, box.height * scaleY);
        }
        
        // --- HANDLING USER INPUT AND SAVING ---
        function handleSliderInput() {
            const box = {
                x: parseInt(sliders.x.value),
                y: parseInt(sliders.y.value),
                width: parseInt(sliders.width.value),
                height: parseInt(sliders.height.value)
            };
            for(const key in values) {
                values[key].value = box[key];
            }
            
            // Redraw immediately for feedback
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoundingBox(box);

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                saveBox(box);
            }, 200);
        }

        function handleNumberInput(key) {
            sliders[key].value = values[key].value;
            handleSliderInput();
        }

        async function saveInterval() {
            const startFrame = parseInt(startFrameInput.value);
            const endFrame = parseInt(endFrameInput.value);
            intervals[currentIntervalIdx].frame_range = [startFrame, endFrame];
            await fetch(`/adjust_interval/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    interval_idx: currentIntervalIdx, 
                    start_frame: startFrame,
                    end_frame: endFrame
                })
            });
            
            // Update the interval info display after saving
            intervalInfo.textContent = `Editing Interval ${currentIntervalIdx + 1} / ${intervals.length} (Frames ${startFrame}-${endFrame})`;
        }


        // Sends the updated box coordinates to the server to be stored.
        async function saveBox(box) {
            // Update the coordinates in our local 'intervals' array first
            intervals[currentIntervalIdx].coords = [box.x, box.x + box.width, box.y, box.y + box.height];
            // Send the new data to the /adjust_box endpoint
            await fetch(`/adjust_box/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ interval_idx: currentIntervalIdx, ...box })
            });
                }

        // --- EVENT LISTENERS ---

        timeline.onmousedown = () => {
            isUserScrubbing = true;
        };
        
        timeline.oninput = () => {
            isUserScrubbing = true; // Ensure scrubbing flag is set during input
            const targetFrame = parseInt(timeline.value);
            
            // Clamp targetFrame to valid range
            const maxFrame = parseInt(timeline.max) || 1000;
            const clampedFrame = Math.max(0, Math.min(targetFrame, maxFrame));
            
            // Only update timeline.value if it's actually different to avoid interference
            if (targetFrame !== clampedFrame) {
                timeline.value = clampedFrame;
            }
            
            video.currentTime = clampedFrame / taskInfo.fps;
            
            // Force immediate redraw when manually scrubbing
            currentFrameDisplay.textContent = `Frame: ${clampedFrame}`;
            
            const activeIdx = findActiveInterval(clampedFrame);
            if (activeIdx !== -1) {
                if(activeIdx !== currentIntervalIdx) {
                    loadInterval(activeIdx, true);
                }
                const [xmin, xmax, ymin, ymax] = intervals[activeIdx].coords;
                const box = { x: xmin, y: ymin, width: xmax - xmin, height: ymax - ymin };
                drawBoundingBox(box);
            } else {
                // Clear canvas if no active interval
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        };
        
        timeline.onchange = () => {
            // Reset scrubbing flag when input is finished
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        timeline.onmouseup = () => {
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        // Add touch support for mobile devices
        timeline.ontouchstart = () => {
            isUserScrubbing = true;
        };
        
        timeline.ontouchend = () => {
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        // Add keyboard support for timeline navigation
        timeline.onkeydown = (e) => {
            const currentValue = parseInt(timeline.value);
            // Ensure step is always valid - get from input first, then timeline.step, then default to 1
            const step = parseInt(timelineStepInput.value) || parseInt(timeline.step) || 1;
            console.log(999,step);
            let newValue = currentValue;
            
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                newValue = Math.max(0, currentValue - step);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                newValue = Math.min(parseInt(timeline.max), currentValue + step);
            }
            setTimelinePosition(newValue);
        };

        // Update timeline when video time changes (e.g., from navigation)
        video.ontimeupdate = () => {
            if (video.paused && !isUpdated) {
                const currentFrame = getCurrentFrame();
                timeline.value = currentFrame;
                currentFrameDisplay.textContent = `Frame: ${currentFrame}`;
            }
            isUpdated = false;
        };

        startFrameInput.onchange = saveInterval;
        endFrameInput.onchange = saveInterval;
        timelineStepInput.onchange = () => {
            timeline.step = parseInt(timelineStepInput.value) || 1;
        };

        // A function to apply the current step value to all sliders
        function updateSliderSteps() {
            const stepValue = parseInt(stepInput.value);
            for (const key in sliders) {
                sliders[key].step = stepValue;
            }
        }

        // Attach the handleSliderInput function to all sliders.
        for (const key in sliders) {
            sliders[key].oninput = handleSliderInput;
            values[key].onchange = () => handleNumberInput(key);
        }

        stepInput.onchange = updateSliderSteps;

        resetBtn.onclick = () => {
            if (!originalIntervals.length) return;

            // Get the original, unmodified box for the current interval
            const originalInterval = originalIntervals[currentIntervalIdx];
            const [xmin, xmax, ymin, ymax] = originalInterval.coords;
            const originalBox = {
                x: xmin,
                y: ymin,
                width: xmax - xmin,
                height: ymax - ymin
            };

            // Update UI, redraw canvas, and save the reverted state to the server
            updateSliderValues(originalBox);
            redrawCanvas(originalBox);
            saveBox(originalBox);

            alert('The box for this interval has been reset to its original position.');
        };

        // Attach the navigation functions to the Previous/Next buttons.
        prevBtn.onclick = () => {
            const newIdx = Math.max(0, currentIntervalIdx - 1);
            if (newIdx !== currentIntervalIdx) {
                loadInterval(newIdx);
            } else {
                // If already at first interval, go to the start of current interval
                loadInterval(currentIntervalIdx, false, false);
            }
        };
        
        nextBtn.onclick = () => {
            const newIdx = Math.min(intervals.length - 1, currentIntervalIdx + 1);
            if (newIdx !== currentIntervalIdx) {
                loadInterval(newIdx);
            } else {
                // If already at last interval, go to the end of current interval
                loadInterval(currentIntervalIdx, false, true);
            }
        };

        useLastBtn.onclick = () => {
            if (currentIntervalIdx > 0) {
                const lastInterval = intervals[currentIntervalIdx - 1];
                const [xmin, xmax, ymin, ymax] = lastInterval.coords;
                const isNullBox = xmin === 0 && xmax === 0 && ymin === 0 && ymax === 0;

                if (isNullBox) {
                    // If the last box was marked as "not a subtitle", apply the same state
                    // to the current box and automatically advance to the next one.
                    const nullBox = { x: 0, y: 0, width: 0, height: 0 };
                    updateSliderValues(nullBox);
                    redrawCanvas(nullBox);
                    saveBox(nullBox);
                    if (currentIntervalIdx < intervals.length - 1) {
                        loadInterval(currentIntervalIdx + 1);
                    }
                } else {
                    // Otherwise, just copy the last box's dimensions.
                    const lastBox = {
                        x: xmin,
                        y: ymin,
                        width: xmax - xmin,
                        height: ymax - ymin
                    };
                    updateSliderValues(lastBox);
                    redrawCanvas(lastBox);
                    saveBox(lastBox);
                }
            }
        };

        notSubBtn.onclick = () => {
            // Create a "null" box to represent no subtitle
            const nullBox = { x: 0, y: 0, width: 0, height: 0 };

            // Update UI, redraw the canvas (with no box), and save this state to the server.
            updateSliderValues(nullBox);
            redrawCanvas(nullBox);
            saveBox(nullBox);

            alert('This interval has been marked as "Not a Subtitle" and will be skipped.');
            // Automatically advance to the next interval if we are not on the last one.
            if (currentIntervalIdx < intervals.length - 1) {
                loadInterval(currentIntervalIdx + 1);
            }
        };

        mergeBtn.onclick = async () => {
            mergeBtn.disabled = true;
            mergeBtn.textContent = "Merging...";
            try {
                const response = await fetch(`/merge_similar_intervals/${taskId}`, { method: 'POST' });
                if (response.ok) {
                    const data = await response.json();
                    alert(`Merge complete! ${data.original_count} intervals were combined into ${data.merged_count}. The editor will now refresh to the beginning of the new list for review.`);
                    
                    // Directly update the UI with the new merged intervals from the response
                    intervals = data.intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.intervals)); // Update the pristine copy

                    // Reset the index to 0 and load the first new interval
                    currentIntervalIdx = 0;
                    await loadInterval(currentIntervalIdx);
                } else {
                    alert("Failed to merge intervals.");
                }
            } catch (e) {
                alert("An error occurred during merging.");
                console.error("Merge error:", e);
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.textContent = "Merge Similar Boxes";
            }
        };

        mergePrevBtn.onclick = async () => {
            mergePrevBtn.disabled = true;
            mergePrevBtn.textContent = "Merging...";
            try {
                const response = await fetch(`/merge_with_previous/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval_idx: currentIntervalIdx })
                });
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update the UI with the new intervals
                    intervals = data.new_intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.new_intervals));
                    
                    // Calculate the new interval index (current interval was merged into previous)
                    const newIntervalIdx = currentIntervalIdx - 1;
                    const mergedInterval = intervals[newIntervalIdx];
                    
                    // Show detailed success message
                    alert(`Successfully merged interval ${currentIntervalIdx + 1} with interval ${currentIntervalIdx}. New interval spans from frame ${mergedInterval.frame_range[0]} to frame ${mergedInterval.frame_range[1]}.`);
                    
                    // Load the merged interval and position timeline at the end
                    await loadInterval(newIntervalIdx, false, true);
                } else {
                    alert("Failed to merge with previous interval.");
                }
            } catch (e) {
                alert("An error occurred during merging.");
                console.error("Merge error:", e);
            } finally {
                mergePrevBtn.disabled = false;
                mergePrevBtn.textContent = "Merge with Previous";
            }
        };

        splitIntervalBtn.onclick = async () => {
            const currentFrame = getCurrentFrame();
            const interval = intervals[currentIntervalIdx];
            const startFrame = interval.frame_range[0];
            const endFrame = interval.frame_range[1];
            
            if (currentFrame <= startFrame || currentFrame >= endFrame) {
                alert("Please position the timeline within the current interval to split it.");
                return;
            }
            
            splitIntervalBtn.disabled = true;
            splitIntervalBtn.textContent = "Splitting...";
            try {
                const response = await fetch(`/split_interval/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        interval_idx: currentIntervalIdx,
                        split_frame: currentFrame
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update the UI with the new intervals
                    intervals = data.new_intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.new_intervals));
                    
                    // Show detailed success message
                    const firstPart = intervals[currentIntervalIdx];
                    const secondPart = intervals[currentIntervalIdx + 1];
                    alert(`Successfully split interval at frame ${currentFrame}. Created two intervals: frames ${firstPart.frame_range[0]}-${firstPart.frame_range[1]} and frames ${secondPart.frame_range[0]}-${secondPart.frame_range[1]}.`);
                    
                    // Stay on the first part of the split interval and position timeline at the end
                    await loadInterval(currentIntervalIdx, false, true);
                } else {
                    alert("Failed to split interval.");
                }
            } catch (e) {
                alert("An error occurred during splitting.");
                console.error("Split error:", e);
            } finally {
                splitIntervalBtn.disabled = false;
                splitIntervalBtn.textContent = "Split Current Interval";
            }
        };

        function pollStatus(statusUrl, downloadUrl) {
            finishBtn.textContent = "Processing...";
            const intervalId = setInterval(async () => {
                try {
                    const response = await fetch(statusUrl);
                    if (!response.ok) {
                        // If status file not found yet, just wait for it to be created.
                        if (response.status === 404) {
                            console.log("Status file not available yet, waiting...");
                            return;
                        }
                        throw new Error(`Status check failed: ${response.statusText}`);
                    }
                    const data = await response.json();
                    if (data.status === "Completed") {
                        clearInterval(intervalId);
                        finishBtn.textContent = "Download Ready!";
                        alert("Processing complete! Your download is starting.");
                        window.location.href = downloadUrl;
                        // Re-enable button after a delay in case of redirect issues
                        setTimeout(() => {
                            finishBtn.disabled = false;
                            finishBtn.textContent = "Finish and Process";
                        }, 5000);
                    } else if (data.status && data.status.startsWith("Error:")) {
                        clearInterval(intervalId);
                        alert(`Processing failed: ${data.status}`);
                        finishBtn.disabled = false;
                        finishBtn.textContent = "Finish and Process";
                    } else {
                        // Still processing, show progress in button text
                        if (finishBtn.textContent.length > 20) {
                           finishBtn.textContent = "Processing...";
                        } else {
                           finishBtn.textContent += ".";
                        }
                    }
                } catch (error) {
                    console.error("Polling error:", error);
                    clearInterval(intervalId);
                    alert("An error occurred while checking the processing status. Please check the console for details.");
                    finishBtn.disabled = false;
                    finishBtn.textContent = "Finish and Process";
                }
            }, 3000); // Poll every 3 seconds
        }

        // This function is called when the user clicks the "Finish and Process" button.
        finishBtn.onclick = async () => {
            finishBtn.disabled = true;
            finishBtn.textContent = "Processing...";
            try {
                // Tell the server to start the final video processing job
                const response = await fetch(`/process_task/${taskId}`, { method: 'POST' });
                if (response.ok) {
                    const data = await response.json();
                    alert("Processing started! This may take a few minutes. Your download will begin automatically when it's ready.");
                    pollStatus(data.status_url, data.download_url);
                } else {
                    alert("Failed to start processing.");
                    finishBtn.disabled = false;
                    finishBtn.textContent = "Finish and Process";
                }
            } catch (e) {
                alert("An error occurred while starting the process.");
                finishBtn.disabled = false;
                finishBtn.textContent = "Finish and Process";
            }
        };

        // --- START THE APPLICATION ---
        
        // Kick off the entire process when the page first loads.
        initializeEditor();
    </script>
</body>
</html>
