<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Box Editor</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f4f7f6;
            --editor-bg-color: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1600px; /* Increased width for new panel */
        }
        .editor-header {
            text-align: center;
        }
        .editor-main {
            display: flex;
            gap: 20px;
            flex-wrap: nowrap; /* keep side-by-side */
            justify-content: center;
            align-items: flex-start;
        }
        /* Orientation-aware layout (both render horizontally) */
        .editor-main.landscape, .editor-main.portrait { flex-direction: row; }
        .preview-container { flex: 1 1 auto; min-width: 360px; max-width: 100%; }
        .preview-container {
            position: relative;
            max-width: 800px;
            flex-grow: 1;
            min-width: 300px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #video-player {
            width: 100%;
            display: block;
        }
        #preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
                 .timeline-container {
             width: 100%;
             padding: 10px 0;
         }
         #timeline-slider {
             width: 100%;
         }
         .timeline-controls {
             margin-top: 10px;
             display: flex;
             align-items: center;
             gap: 10px;
         }
         .timeline-controls input[type="number"] {
             width: 60px;
             padding: 3px;
         }
        .controls {
            background-color: var(--editor-bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 320px;
            flex: 0 0 320px; /* fixed sidebar width */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .instructions {
            font-size: 0.8em;
            color: #666;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .slider-group {
            display: grid;
            grid-template-columns: 50px 1fr 60px; /* Adjusted for number input */
            align-items: center;
            gap: 10px;
        }
        input[type="number"] {
            width: 100%;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        input[type="range"] { width: 100%; }
        .navigation { display: flex; justify-content: space-between; gap: 10px; }
        .extra-controls { margin-top: 10px; }
        .step-control { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #357abd; }
        /* Primary (blue) remains default for most buttons */

        /* Green actions */
        #finish-btn, #split-interval-btn { background-color: #28a745; }
        #finish-btn:hover:not(:disabled), #split-interval-btn:hover:not(:disabled) { background-color: #218838; }

        /* Red actions */
        #reset-btn, #not-sub-btn { background-color: #dc3545; }
        #reset-btn:hover:not(:disabled), #not-sub-btn:hover:not(:disabled) { background-color: #bb2d3b; }

        /* Styles for the new subtitle player */
        .subtitle-player-container {
            background-color: var(--editor-bg-color);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 380px;
            flex: 0 0 380px;
            height: 650px; /* Approximate height */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #subtitle-player {
            flex-grow: 1;
        }
        .subtitle-line {
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
            margin-bottom: 5px;
            font-size: 0.9em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .subtitle-timestamp {
            font-size: 0.8em;
            color: #6c757d;
            font-family: monospace;
        }
        .subtitle-line:hover {
            background-color: #e9ecef;
        }
        .subtitle-line.active {
            background-color: var(--primary-color);
            color: white;
        }
        .subtitle-line.active .subtitle-timestamp {
            color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-header">
            <h1>Subtitle Box Editor</h1>
            <h3 id="interval-info">Loading...</h3>
        </div>
        <div class="editor-main">
            <div class="subtitle-player-container" style="display: none;">
                <h3>Generated Subtitles</h3>
                <div id="subtitle-player"></div>
            </div>
            <div class="preview-container">
                <video id="video-player" controls></video>
                <canvas id="preview-canvas"></canvas>
                <div id="processing-overlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.6); color:#fff; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:12px;">
                    <div style="font-size:18px; text-align:center; max-width:90%;">
                        Your video is being processed. You can continue to browse, but edits are locked. After processing, a new video file will be generated for download.
                    </div>
                    <div id="processing-stage" style="font-size:16px;">Stage: Preparing</div>
                    <div style="width:80%; max-width:520px; background:#222; height:10px; border-radius:6px; overflow:hidden;">
                        <div id="processing-bar" style="height:100%; width:0%; background:#4a90e2;"></div>
                    </div>
                    <div id="processing-percent" style="font-size:14px;">0%</div>
                </div>
            </div>
            <div class="controls">
                <div class="extra-controls">
                    <button id="generate-subtitles-btn">Generate Subtitles</button>
                </div>
                <div class="timeline-container">
                    <label for="timeline-slider">Timeline:</label>
                    <input type="range" id="timeline-slider" value="0" step="1" min="0" max="1000">
                    <span id="current-frame-display">Frame: 0</span>
                    <div class="timeline-controls">
                        <label>Timeline Step: <input type="number" id="timeline-step-input" value="1" min="1" max="100"></label>
                    </div>
                </div>
                <div class="interval-controls">
                    <label>Start Frame: <input type="number" id="start-frame-input"></label>
                    <label>End Frame: <input type="number" id="end-frame-input"></label>
                </div>
                
                <div class="slider-group">
                    <label for="x-slider">X:</label>
                    <input type="range" id="x-slider" name="x">
                    <input type="number" id="x-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="width-slider">Width:</label>
                    <input type="range" id="width-slider" name="width">
                    <input type="number" id="width-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="y-slider">Y:</label>
                    <input type="range" id="y-slider" name="y">
                    <input type="number" id="y-value" class="value-input">
                </div>
                <div class="slider-group">
                    <label for="height-slider">Height:</label>
                    <input type="range" id="height-slider" name="height">
                    <input type="number" id="height-value" class="value-input">
                </div>
                <div class="step-control">
                    <label for="step-input">Step:</label>
                    <input type="number" id="step-input" value="10" min="1" style="width: 60px;">
                </div>
                <div class="navigation">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
                <div id="main-controls-wrapper">
                    <div class="extra-controls">
                        <button id="use-last-btn" style="width: 100%;">Use Previous Box</button>
                    </div>
                    <div class="extra-controls">
                        <button id="not-sub-btn" style="width: 100%;">Not a Subtitle</button>
                    </div>
                    <div class="extra-controls">
                        <button id="split-interval-btn" style="width: 100%;">Split Current Interval</button>
                    </div>
                    <div class="extra-controls">
                        <button id="merge-prev-btn" style="width: 100%;">Merge with Previous</button>
                    </div>
                    <div class="extra-controls">
                        <button id="reset-btn" style="width: 100%;">Reset Current Box</button>
                    </div>
                </div>
                <button id="finish-btn">Finish and Process</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. INITIALIZATION ---
        // Get the unique task ID from the URL (e.g., /editor/some-uuid-goes-here)
        const taskId = window.location.pathname.split('/').pop();
        
        // Global variables to hold the state of the editor
        let intervals = []; // All subtitle intervals from the server
        let originalIntervals = []; // A pristine copy of the intervals for the "reset" feature
        let taskInfo = {};  // Video metadata like width and height
        let currentIntervalIdx = 0; // The index of the interval we are currently editing
        let debounceTimer; // A timer to prevent spamming the API while moving sliders
        let currentImage = new Image(); // An image object to hold the current raw video frame
        let isUserScrubbing = false; // Flag to track when user is manually scrubbing timeline
        let isUpdated = false;
        let parsedSubtitles = []; // Holds subtitles from the generated .txt file
        let currentSubtitleIndex = -1; // Tracks the currently highlighted subtitle in the player

        // Helper function to disable controls during async operations like seeking
        function setControlsDisabled(disabled) {
            for (const key in sliders) {
                sliders[key].disabled = disabled;
                values[key].disabled = disabled;
            }
            stepInput.disabled = disabled;
        }

        function setAllControlsDisabled(disabled) {
            // Select all buttons and inputs in the controls panel
            const allControls = document.querySelectorAll('.controls button, .controls input');
            
            allControls.forEach(control => {
                // Don't disable the "Generate Subtitles" button itself
                if (control.id !== 'generate-subtitles-btn') {
                    control.disabled = disabled;
                }
            });

            // Also handle the main wrapper visibility
            const controlsWrapper = document.getElementById('main-controls-wrapper');
            if (controlsWrapper) {
                controlsWrapper.style.opacity = disabled ? 0.5 : 1;
                controlsWrapper.style.pointerEvents = disabled ? 'none' : 'auto';
            }
        }

        // Get references to all the HTML elements we will interact with
        const video = document.getElementById('video-player');
        const timeline = document.getElementById('timeline-slider');
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const intervalInfo = document.getElementById('interval-info');
        const currentFrameDisplay = document.getElementById('current-frame-display');
        const startFrameInput = document.getElementById('start-frame-input');
        const endFrameInput = document.getElementById('end-frame-input');
        const timelineStepInput = document.getElementById('timeline-step-input');
        const sliders = {
            x: document.getElementById('x-slider'),
            y: document.getElementById('y-slider'),
            width: document.getElementById('width-slider'),
            height: document.getElementById('height-slider')
        };
        const values = {
            x: document.getElementById('x-value'),
            y: document.getElementById('y-value'),
            width: document.getElementById('width-value'),
            height: document.getElementById('height-value')
        };
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');
        const useLastBtn = document.getElementById('use-last-btn');
        const stepInput = document.getElementById('step-input');
        const resetBtn = document.getElementById('reset-btn');
        const notSubBtn = document.getElementById('not-sub-btn');
        const mergePrevBtn = document.getElementById('merge-prev-btn');
        const splitIntervalBtn = document.getElementById('split-interval-btn');
        const subtitlePlayerContainer = document.querySelector('.subtitle-player-container');
        const subtitlePlayer = document.getElementById('subtitle-player');
        const generateSubtitlesBtn = document.getElementById('generate-subtitles-btn');

        // This is the main function that runs when the page first loads.
        async function initializeEditor() {
            try {
                const [intervalsResponse, infoResponse] = await Promise.all([
                    fetch(`/subtitle_intervals/${taskId}`),
                    fetch(`/task_info/${taskId}`)
                ]);
                const intervalsData = await intervalsResponse.json();
                const infoData = await infoResponse.json();
                
                intervals = intervalsData.intervals;
                originalIntervals = JSON.parse(JSON.stringify(intervalsData.intervals));
                taskInfo = infoData;
                
                // Show the subtitle player container immediately
                subtitlePlayerContainer.style.display = 'flex';
                populateSubtitlePlayer(intervals);

                if (infoData.status === 'Generation Complete') {
                    // If subtitles are already generated, hide the button and enable controls
                    generateSubtitlesBtn.style.display = 'none';
                    setAllControlsDisabled(false);
                } else {
                    // Otherwise, disable controls until subtitles are generated
                    generateSubtitlesBtn.style.display = 'block'; // Ensure it's visible
                    setAllControlsDisabled(true);
                }
                
                updateSliderSteps();

                // The seeking event is triggered when the user jumps to a new frame
                // The seeked event is triggered when the video has finished seeking
                video.onseeking = () => setControlsDisabled(true);
                video.onseeked = () => setControlsDisabled(false);
                
                // Setup video player
                video.src = `/stream_video/${taskId}`;
                video.onloadedmetadata = () => {
                    // Determine orientation and adjust layout classes
                    const editorMainEl = document.querySelector('.editor-main');
                    const isLandscape = video.videoWidth >= video.videoHeight;
                    editorMainEl.classList.remove('portrait', 'landscape');
                    editorMainEl.classList.add(isLandscape ? 'landscape' : 'portrait');

                    // Use authoritative total_frames and fps from the backend OpenCV reader
                    if (taskInfo.total_frames && taskInfo.fps) {
                        console.log(`[INIT] Using authoritative video info from backend: ${taskInfo.total_frames} frames at ${taskInfo.fps.toFixed(2)} FPS.`);
                        timeline.max = taskInfo.total_frames;
                    } else {
                        // Fallback for older tasks if data is missing
                        console.warn("[INIT] Backend did not provide total_frames/fps. Guessing from intervals.");
                        timeline.max = intervals.length > 0 ? intervals[intervals.length-1].frame_range[1] : 1000;
                    }
                    console.log(`[INIT] Timeline max: ${timeline.max}`);
                    timeline.step = 1;

                    loadInterval(0);
                    requestAnimationFrame(drawLoop);
                };

            } catch (error) {
                console.error("Failed to initialize editor:", error);
                intervalInfo.textContent = "Error loading task. Please try again.";
            }
        }

        function getCurrentFrame() {
            return Math.floor(video.currentTime * taskInfo.fps + 0.5);
        }

        // Intervals from server are 0-based, matching the video's 0-based frame index.
        function findActiveInterval(frame) {
            return intervals.findIndex(i => frame >= i.frame_range[0] && frame <= i.frame_range[1]);
        }

        function setTimelinePosition(frame) {
            // Helper function to set timeline position (expects 0-based frame)
            isUserScrubbing = true;
            isUpdated = true; // Flag to prevent timeline updates during scrubbing
            timeline.value = frame;
            video.currentTime = frame / taskInfo.fps;
            currentFrameDisplay.textContent = `Frame: ${frame}`;
            // Clear any existing timeout to prevent race conditions
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        }

        // --- CORE EDITOR LOGIC ---
        async function loadInterval(idx, fromTimeline = false, goToEnd = false) {
            clearTimeout(debounceTimer);
            
            // Ensure valid index
            if (idx < 0) idx = 0;
            if (idx >= intervals.length) idx = intervals.length - 1;
            
            currentIntervalIdx = idx;
            const interval = intervals[idx];

            if (!fromTimeline) {
                const boundary = goToEnd ? interval.frame_range[1] : interval.frame_range[0];
                setTimelinePosition(boundary); // Frame ranges are now 0-based
                // Display as 1-based
                startFrameInput.value = interval.frame_range[0] + 1;
                endFrameInput.value = interval.frame_range[1] + 1;
            }

            intervalInfo.textContent = `Editing Interval ${idx + 1} / ${intervals.length} (Frames ${interval.frame_range[0] + 1}-${interval.frame_range[1] + 1})`;
            startFrameInput.value = interval.frame_range[0] + 1;
            endFrameInput.value = interval.frame_range[1] + 1;
            
            const [xmin, xmax, ymin, ymax] = interval.coords;
            const currentBox = {
                x: xmin,
                y: ymin,
                width: xmax - xmin,
                height: ymax - ymin
            };

            updateSliderRanges();
            updateSliderValues(currentBox);

            // Draw the correct box on top of the current interval's subtitle
            redrawCanvas(currentBox);

            // Always enable navigation buttons - let the click handlers deal with bounds
            prevBtn.disabled = currentIntervalIdx === 0;
            nextBtn.disabled = currentIntervalIdx === intervals.length - 1;
            useLastBtn.disabled = currentIntervalIdx === 0;

            mergePrevBtn.disabled = currentIntervalIdx === 0;
            splitIntervalBtn.disabled = false;
        }
        
        function updateSliderRanges() {
            sliders.x.max = taskInfo.video_width;
            sliders.y.max = taskInfo.video_height;
            sliders.width.max = taskInfo.video_width;
            sliders.height.max = taskInfo.video_height;
        }
        
        function updateSliderValues(box) {
            for (const key in sliders) {
                sliders[key].value = box[key];
                values[key].value = box[key];
            }
        }

        // --- RENDERING AND PREVIEW ---

        // Deprecated: previously used to fetch static frames beneath overlay.
        // Keeping the function to avoid runtime errors from any leftover calls.
        async function loadFrameImage(frameIdx, boxToDraw) {
            try {
                redrawCanvas(boxToDraw);
            } catch (err) {
                console.error('loadFrameImage noop error', err);
            }
        }

        // Redraw overlay-only (boxes) using the current <video> frame beneath the canvas.
        function redrawCanvas(box) {
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBoundingBox(box);
        }
        
        function drawLoop() {
            // Match canvas size to video element size for correct scaling
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const currentFrame = getCurrentFrame();
            const currentTime = video.currentTime;
            
            // Only update timeline if video is playing AND user is not manually scrubbing
            // This prevents the drawLoop from interfering with manual timeline scrubbing
            if (!video.paused && !isUserScrubbing) {
                currentFrameDisplay.textContent = `Frame: ${currentFrame}`;
            }

            let boxToDraw = null;
            let activeIdx = -1;

            if (video.paused) {
                // When paused, always draw the box for the currently selected interval
                activeIdx = currentIntervalIdx;
            } else {
                // When playing, find the interval corresponding to the current video frame
                activeIdx = findActiveInterval(currentFrame);
                // And if we play into a new interval, update the editor controls to match
                if (activeIdx !== -1 && activeIdx !== currentIntervalIdx && !isUserScrubbing) {
                    loadInterval(activeIdx, true);
                }
            }

            // If we have a valid interval (either paused on one, or playing through one), get its coordinates
            if (activeIdx !== -1 && intervals[activeIdx]) {
                const [xmin, xmax, ymin, ymax] = intervals[activeIdx].coords;
                boxToDraw = { x: xmin, y: ymin, width: xmax - xmin, height: ymax - ymin };
            }

            if (boxToDraw) {
                drawBoundingBox(boxToDraw);
            }

            // Sync subtitle player with video
            if (intervals && intervals.length > 0) {
                const activeSubIndex = findActiveInterval(currentFrame);
                if (activeSubIndex !== currentSubtitleIndex) {
                    if (currentSubtitleIndex !== -1) {
                        subtitlePlayer.children[currentSubtitleIndex]?.classList.remove('active');
                    }
                    if (activeSubIndex !== -1) {
                        const activeLine = subtitlePlayer.children[activeSubIndex];
                        if (activeLine) {
                            activeLine.classList.add('active');
                            // Only scroll into view if the video is playing to avoid jumpiness
                            if (!video.paused) {
                                activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        }
                    }
                    currentSubtitleIndex = activeSubIndex;
                }
            }

            requestAnimationFrame(drawLoop);
        }

        function drawBoundingBox(box) {
            // Scale box coordinates from original video dimensions to displayed video dimensions
            const scaleX = canvas.width / taskInfo.video_width;
            const scaleY = canvas.height / taskInfo.video_height;
            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 2;
            ctx.strokeRect(box.x * scaleX, box.y * scaleY, box.width * scaleX, box.height * scaleY);
        }
        
        // MOUSE INTERACTION: DRAG/RESIZE BOX
        const EDGE_MARGIN = 8; // pixels on canvas space
        let isMouseDown = false;
        let dragMode = null; // 'move' | 'left' | 'right' | 'top' | 'bottom'
        let startMouse = { x: 0, y: 0 };
        let startBox = { x: 0, y: 0, width: 0, height: 0 };
        const previewContainer = document.querySelector('.preview-container');

        function getScale() {
            const scaleX = canvas.width / taskInfo.video_width;
            const scaleY = canvas.height / taskInfo.video_height;
            return { scaleX, scaleY };
        }

        function getCurrentBox() {
            if (!intervals[currentIntervalIdx]) return null;
            const [xmin, xmax, ymin, ymax] = intervals[currentIntervalIdx].coords;
            return { x: xmin, y: ymin, width: xmax - xmin, height: ymax - ymin };
        }

        function clampBox(box) {
            // Ensure box stays within video bounds
            box.x = Math.max(0, Math.min(box.x, taskInfo.video_width - box.width));
            box.y = Math.max(0, Math.min(box.y, taskInfo.video_height - box.height));
            box.width = Math.max(1, Math.min(box.width, taskInfo.video_width - box.x));
            box.height = Math.max(1, Math.min(box.height, taskInfo.video_height - box.y));
            return box;
        }

        // Convert canvas coordinates back to original video frame coordinates
        function canvasToVideoCoords(cx, cy) {
            const { scaleX, scaleY } = getScale();
            return { x: cx / scaleX, y: cy / scaleY };
        }

        // Determines if the cursor is in the box or an edge of the box
        // send 'move' signal if the cursor is in the box
        // send 'left', 'right', 'top', 'bottom' signals if the cursor is on any edge of the box
        // send null if the cursor is not in the box or an edge of the box
        function hitTestOnCanvas(cx, cy) {
            const box = getCurrentBox();
            if (!box) return null;
            const { scaleX, scaleY } = getScale();
            const bx = box.x * scaleX;
            const by = box.y * scaleY;
            const bw = box.width * scaleX;
            const bh = box.height * scaleY;

            const insideX = cx >= bx && cx <= bx + bw;
            const insideY = cy >= by && cy <= by + bh;
            const nearLeft = Math.abs(cx - bx) <= EDGE_MARGIN && insideY;
            const nearRight = Math.abs(cx - (bx + bw)) <= EDGE_MARGIN && insideY;
            const nearTop = Math.abs(cy - by) <= EDGE_MARGIN && insideX;
            const nearBottom = Math.abs(cy - (by + bh)) <= EDGE_MARGIN && insideX;

            if (nearLeft) return 'left';
            if (nearRight) return 'right';
            if (nearTop) return 'top';
            if (nearBottom) return 'bottom';
            if (insideX && insideY) return 'move';
            return null;
        }

        function setCanvasCursor(cx, cy) {
            const mode = hitTestOnCanvas(cx, cy);
            let cursor = 'default';
            if (mode === 'left' || mode === 'right') cursor = 'ew-resize';
            else if (mode === 'top' || mode === 'bottom') cursor = 'ns-resize';
            else if (mode === 'move') cursor = 'move';
            // Do not set cursor if the cursor is not in the proximity of the box
            canvas.style.cursor = cursor;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            if (!isMouseDown) {
                setCanvasCursor(cx, cy);
                return;
            }

            if (!intervals[currentIntervalIdx]) return;
            const { scaleX, scaleY } = getScale();
            const vx = cx / scaleX;
            const vy = cy / scaleY;
            const dx = vx - startMouse.x;
            const dy = vy - startMouse.y;

            let newBox = { ...startBox };
            if (dragMode === 'move') {
                newBox.x = Math.round(startBox.x + dx);
                newBox.y = Math.round(startBox.y + dy);
            } else if (dragMode === 'left') {
                const newX = Math.round(startBox.x + dx);
                const maxX = startBox.x + startBox.width - 1;
                newBox.x = Math.min(Math.max(0, newX), maxX);
                newBox.width = startBox.width + (startBox.x - newBox.x);
            } else if (dragMode === 'right') {
                const newRight = Math.round(startBox.x + startBox.width + dx);
                const minRight = startBox.x + 1;
                const clampedRight = Math.min(Math.max(minRight, newRight), taskInfo.video_width);
                newBox.width = clampedRight - startBox.x;
            } else if (dragMode === 'top') {
                const newY = Math.round(startBox.y + dy);
                const maxY = startBox.y + startBox.height - 1;
                newBox.y = Math.min(Math.max(0, newY), maxY);
                newBox.height = startBox.height + (startBox.y - newBox.y);
            } else if (dragMode === 'bottom') {
                const newBottom = Math.round(startBox.y + startBox.height + dy);
                const minBottom = startBox.y + 1;
                const clampedBottom = Math.min(Math.max(minBottom, newBottom), taskInfo.video_height);
                newBox.height = clampedBottom - startBox.y;
            }

            newBox = clampBox(newBox);
            // Update state and UI
            intervals[currentIntervalIdx].coords = [newBox.x, newBox.x + newBox.width, newBox.y, newBox.y + newBox.height];
            updateSliderValues(newBox);
            redrawCanvas(newBox);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const mode = hitTestOnCanvas(cx, cy);
            if (!mode) return;
            const { x, y } = canvasToVideoCoords(cx, cy);
            const box = getCurrentBox();
            if (!box) return;
            isMouseDown = true;
            dragMode = mode;
            startMouse = { x, y };
            startBox = { ...box };
            e.preventDefault();
        });

        function finishDragOrResize() {
            if (!isMouseDown) return;
            isMouseDown = false;
            const box = getCurrentBox();
            if (box) {
                // Persist to backend
                saveBox(box);
            }
        }

        canvas.addEventListener('mouseup', () => finishDragOrResize());
        canvas.addEventListener('mouseleave', () => finishDragOrResize());

        // Toggle canvas pointer-events based on proximity to the box so that
        // clicks outside the box (or on video controls) reach the <video> element.
        function updateCanvasPointerEventsFromMouseEvent(e) {
            if (isMouseDown) return; // keep interactions while dragging
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const within = cx >= 0 && cy >= 0 && cx <= rect.width && cy <= rect.height;
            if (!within) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
                return;
            }
            const mode = hitTestOnCanvas(cx, cy);
            if (mode) {
                canvas.style.pointerEvents = 'auto';
                setCanvasCursor(cx, cy);
            } else {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
        }

        if (previewContainer) {
            previewContainer.addEventListener('mousemove', updateCanvasPointerEventsFromMouseEvent, { passive: true });
            previewContainer.addEventListener('mouseleave', () => {
                if (isMouseDown) return;
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            });
        }
 
        // --- HANDLING USER INPUT AND SAVING ---
        function handleSliderInput() {
            const box = {
                x: parseInt(sliders.x.value),
                y: parseInt(sliders.y.value),
                width: parseInt(sliders.width.value),
                height: parseInt(sliders.height.value)
            };
            for(const key in values) {
                values[key].value = box[key];
            }
            
            // Directly update the coordinates in our local state. The `drawLoop` will
            // immediately reflect this change on the next frame, creating a single source of truth.
            if (intervals[currentIntervalIdx]) {
                intervals[currentIntervalIdx].coords = [box.x, box.x + box.width, box.y, box.y + box.height];
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                saveBox(box);
            }, 200);
        }

        function handleNumberInput(key) {
            sliders[key].value = values[key].value;
            handleSliderInput();
        }

        async function saveInterval() {
            const startFrame = parseInt(startFrameInput.value);
            const endFrame = Math.min(parseInt(endFrameInput.value), parseInt(timeline.max) + 1);
            
            // Convert back to 0-based for local state and 1-based for API
            const internalStart = startFrame - 1;
            const internalEnd = endFrame - 1;
            intervals[currentIntervalIdx].frame_range = [internalStart, internalEnd];

            try {
                const response = await fetch(`/adjust_interval/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        interval_idx: currentIntervalIdx, 
                        start_frame: startFrame, // Send 1-based
                        end_frame: endFrame     // Send 1-based
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    // The backend now returns the full updated list of intervals (0-based)
                    intervals = data.new_intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.new_intervals));
                    alert(data.message); // Show the more informative message from the server
                    console.log(`[Interval]`, `Saved interval ${currentIntervalIdx + 1} with frame range [${startFrame}, ${endFrame}]`);
                    // The indices might have changed, so we reload the current interval to be safe
                    loadInterval(currentIntervalIdx);
                    populateSubtitlePlayer(intervals); // Refresh the subtitle player
                } else {
                    // If the backend returns an error (e.g., collision), show it to the user.
                    alert(`Error: ${data.detail || 'Could not save interval.'}`);
                    // Revert local changes to match the server state
                    initializeEditor();
                }
            } catch (err) {
                console.error('adjust_interval error', err);
                alert('An error occurred while saving the interval.');
            }
        }


        // Sends the updated box coordinates to the server to be stored.
        async function saveBox(box) {
            // The local 'intervals' array is updated directly in handleSliderInput.
            // This function is now only responsible for sending the final state to the server.
            console.log(`[SaveBox]`, `Saving box for interval ${currentIntervalIdx + 1} with coordinates [${box.x}, ${box.x + box.width}, ${box.y}, ${box.y + box.height}]`);
            // Send the new data to the /adjust_box endpoint
            try {
                const response = await fetch(`/adjust_box/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval_idx: currentIntervalIdx, ...box })
                });
                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    console.error('adjust_box failed', response.status, text);
                }
            } catch (err) {
                console.error('adjust_box error', err);
            }

        }

        // --- EVENT LISTENERS ---

        timeline.onmousedown = () => {
            isUserScrubbing = true;
        };
        
        timeline.oninput = () => {
            // Ignore programmatic timeline updates; only act on real user scrubs
            if (!isUserScrubbing) {
                return;
            }
            isUserScrubbing = true; // Ensure scrubbing flag is set during input
            const targetFrame = parseInt(timeline.value);
            
            // Clamp targetFrame to valid range
            const maxFrame = parseInt(timeline.max) || 1000;
            const clampedFrame = Math.max(0, Math.min(targetFrame, maxFrame));
            
            // Only update timeline.value if it's actually different to avoid interference
            if (targetFrame !== clampedFrame) {
                timeline.value = clampedFrame;
            }
            
            video.currentTime = clampedFrame / taskInfo.fps;
            
            // Force immediate redraw when manually scrubbing
            currentFrameDisplay.textContent = `Frame: ${clampedFrame}`;
            const activeIdx = findActiveInterval(clampedFrame);
            if (activeIdx !== -1) {
                if (activeIdx !== currentIntervalIdx) {
                    console.log(`[Timeline]`, `Switched to interval ${activeIdx + 1}/${intervals.length} at frame ${clampedFrame} (range [${intervals[activeIdx].frame_range[0]}, ${intervals[activeIdx].frame_range[1]}])`);
                    loadInterval(activeIdx, true);
                }
                const [xmin, xmax, ymin, ymax] = intervals[activeIdx].coords;
                const box = { x: xmin, y: ymin, width: xmax - xmin, height: ymax - ymin };
                drawBoundingBox(box);
            } else {
                // Clear canvas if no active interval
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                console.log(`[Timeline]`, `No active interval at frame ${clampedFrame}`);
            }
        };
        
        timeline.onchange = () => {
            // Reset scrubbing flag when input is finished
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        timeline.onmouseup = () => {
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        // Add touch support for mobile devices
        timeline.ontouchstart = () => {
            isUserScrubbing = true;
        };
        
        timeline.ontouchend = () => {
            if (window.timelineScrubbingTimeout) {
                clearTimeout(window.timelineScrubbingTimeout);
            }
            window.timelineScrubbingTimeout = setTimeout(() => {
                isUserScrubbing = false;
            }, 100);
        };
        
        // Add keyboard support for timeline navigation
        timeline.onkeydown = (e) => {
            const currentValue = parseInt(timeline.value);
            // Ensure step is always valid - get from input first, then timeline.step, then default to 1
            const step = parseInt(timelineStepInput.value) || parseInt(timeline.step) || 1;
            console.log(`[StepSize]`,step);
            let newValue = currentValue;
            
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                newValue = Math.max(0, currentValue - step);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                newValue = Math.min(parseInt(timeline.max), currentValue + step);
            }
            setTimelinePosition(newValue);

            // Update current interval selection and log when navigating via keyboard
            const activeIdx = findActiveInterval(newValue);
            if (activeIdx !== -1) {
                if (activeIdx !== currentIntervalIdx) {
                    console.log(`[Keyboard]`, `Switched to interval ${activeIdx + 1}/${intervals.length} at frame ${newValue} (range [${intervals[activeIdx].frame_range[0]}, ${intervals[activeIdx].frame_range[1]}])`);
                    loadInterval(activeIdx, true);
                }
            } else {
                console.log(`[Keyboard]`, `No active interval at frame ${newValue}`);
            }
        };

        // Update timeline when video time changes (e.g., from navigation)
        video.ontimeupdate = () => {
            // Handles timeline updates during video playback.
            if (!video.paused && !isUserScrubbing) {
                const currentFrame = getCurrentFrame();
                timeline.value = currentFrame;
                currentFrameDisplay.textContent = `Frame: ${currentFrame}`;
            }

            // Do not sync timeline from video while the user is actively scrubbing,
            // as this can cause floating point rounding errors that make the timeline jump.
            // Let the user's input be the source of truth during the scrub.
            if (video.paused && !isUpdated && !isUserScrubbing) {
                let currentFrame = getCurrentFrame();
                // When a video finishes playing, its currentTime may slightly exceed
                // the duration, causing the calculated frame to be one larger than the max.
                if (currentFrame > timeline.max) {
                    currentFrame = parseInt(timeline.max);
                }
                timeline.value = currentFrame;
                currentFrameDisplay.textContent = `Frame: ${currentFrame}`;
                console.log(`[Video]`, currentFrame);
                
                // When paused, if the frame has changed to a new interval, load it.
                const activeIdx = findActiveInterval(currentFrame);
                if (activeIdx !== -1 && activeIdx !== currentIntervalIdx) {
                    console.log(`[Video]`, `Switched to interval ${activeIdx + 1}/${intervals.length} at frame ${currentFrame} (range [${intervals[activeIdx].frame_range[0]}, ${intervals[activeIdx].frame_range[1]}])`);
                    loadInterval(activeIdx, true);
                }
            }
            isUpdated = false;
        };

        startFrameInput.onchange = saveInterval;
        endFrameInput.onchange = saveInterval;
        timelineStepInput.onchange = () => {
            // Do not change native slider step; handled in keydown logic
        };

        // A function to apply the current step value to all sliders
        function updateSliderSteps() {
            const stepValue = parseInt(stepInput.value);
            for (const key in sliders) {
                sliders[key].step = stepValue;
            }
        }

        // Attach the handleSliderInput function to all sliders.
        for (const key in sliders) {
            sliders[key].oninput = handleSliderInput;
            values[key].onchange = () => handleNumberInput(key);
        }

        stepInput.onchange = updateSliderSteps;

        resetBtn.onclick = async () => {
            if (!originalIntervals.length) return;

            // Get the original, unmodified box for the current interval
            const originalInterval = originalIntervals[currentIntervalIdx];
            const [xmin, xmax, ymin, ymax] = originalInterval.coords;
            const originalBox = {
                x: xmin,
                y: ymin,
                width: xmax - xmin,
                height: ymax - ymin
            };

            // Update local state FIRST so drawLoop uses the correct box on the next frame
            intervals[currentIntervalIdx].coords = [xmin, xmax, ymin, ymax];

            // Update UI, load the current frame image, redraw canvas, and save the reverted state to the server
            updateSliderValues(originalBox);
            await loadFrameImage(getCurrentFrame(), originalBox);
            saveBox(originalBox);

            alert('The box for this interval has been reset to its original position.');
        };

        // Attach the navigation functions to the Previous/Next buttons.
        prevBtn.onclick = () => {
            console.log(`Current Interval`, currentIntervalIdx)
            const newIdx = Math.max(0, currentIntervalIdx - 1);
            if (newIdx !== currentIntervalIdx) {
                loadInterval(newIdx);
                console.log(`[Prev]`, `Going to Interval ${newIdx + 1}`)
            } else {
                // If already at first interval, go to the start of current interval
                loadInterval(currentIntervalIdx, false, false);
            }
        };
        
        nextBtn.onclick = () => {
            console.log(`Current Interval`, currentIntervalIdx)
            const newIdx = Math.min(intervals.length - 1, currentIntervalIdx + 1);
            if (newIdx !== currentIntervalIdx) {
                loadInterval(newIdx);
                console.log(`[Next]`, `Going to Interval ${newIdx + 1}`)
            } else {
                // If already at last interval, go to the end of current interval
                loadInterval(currentIntervalIdx, false, true);
            }
        };

        useLastBtn.onclick = async () => {
            if (currentIntervalIdx > 0) {
                const lastInterval = intervals[currentIntervalIdx - 1];
                const [xmin, xmax, ymin, ymax] = lastInterval.coords;
                const isNullBox = xmin === 0 && xmax === 0 && ymin === 0 && ymax === 0;

                if (isNullBox) {
                    // If the last box was marked as "not a subtitle", apply the same state
                    // to the current box and automatically advance to the next one.
                    const nullBox = { x: 0, y: 0, width: 0, height: 0 };
                    intervals[currentIntervalIdx].coords = [0, 0, 0, 0]; // Update state for drawLoop
                    updateSliderValues(nullBox);
                    saveBox(nullBox);
                    if (currentIntervalIdx < intervals.length - 1) {
                        loadInterval(currentIntervalIdx + 1);
                    }
                } else {
                    // Otherwise, just copy the last box's dimensions.
                    const lastBox = {
                        x: xmin,
                        y: ymin,
                        width: xmax - xmin,
                        height: ymax - ymin
                    };
                    intervals[currentIntervalIdx].coords = [xmin, xmax, ymin, ymax]; // Update state for drawLoop
                    updateSliderValues(lastBox);
                    saveBox(lastBox);
                }
            }
        };

        notSubBtn.onclick = async () => {
            // Create a "null" box to represent no subtitle
            const nullBox = { x: 0, y: 0, width: 0, height: 0 };
            intervals[currentIntervalIdx].coords = [0, 0, 0, 0]; // Update state for drawLoop

            // Update UI, load the current frame image, redraw the canvas (with no box), and save this state to the server.
            updateSliderValues(nullBox);
            saveBox(nullBox);

            alert('This interval has been marked as "Not a Subtitle" and will be skipped.');
            // Automatically advance to the next interval if we are not on the last one.
            if (currentIntervalIdx < intervals.length - 1) {
                loadInterval(currentIntervalIdx + 1);
            }
        };

        mergePrevBtn.onclick = async () => {
            mergePrevBtn.disabled = true;
            mergePrevBtn.textContent = "Merging...";
            try {
                const response = await fetch(`/merge_with_previous/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval_idx: currentIntervalIdx })
                });
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update the UI with the new intervals
                    intervals = data.new_intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.new_intervals));
                    
                    // Calculate the new interval index (current interval was merged into previous)
                    const newIntervalIdx = currentIntervalIdx - 1;
                    const mergedInterval = intervals[newIntervalIdx];
                    
                    // Show detailed success message
                    alert(`Successfully merged interval ${currentIntervalIdx + 1} with interval ${currentIntervalIdx}. New interval spans from frame ${mergedInterval.frame_range[0]} to frame ${mergedInterval.frame_range[1]}.`);
                    console.log(`[Merge]`, `Merged interval ${currentIntervalIdx + 1} with interval ${currentIntervalIdx}. New interval spans from frame ${mergedInterval.frame_range[0]} to frame ${mergedInterval.frame_range[1]}.`);
                    // Load the merged interval and position timeline at the end
                    await loadInterval(newIntervalIdx, false, true);
                    populateSubtitlePlayer(intervals); // Refresh the subtitle player
                } else {
                    alert("Failed to merge with previous interval.");
                }
            } catch (e) {
                alert("An error occurred during merging.");
                console.error("Merge error:", e);
            } finally {
                mergePrevBtn.disabled = false;
                mergePrevBtn.textContent = "Merge with Previous";
            }
        };

        splitIntervalBtn.onclick = async () => {
            const currentFrame0 = getCurrentFrame();
            
            // The backend's `split_frame` parameter defines the start of the second new interval.
            // By sending the current frame, we split the interval *at* the current frame.
            const splitFrame = currentFrame0;

            const interval = intervals[currentIntervalIdx];
            const startFrame = interval.frame_range[0];
            const endFrame = interval.frame_range[1];
            
            // Ensure the split point is valid (not on the first or last frame of the interval)
            if (splitFrame <= startFrame || splitFrame >= endFrame) {
                alert(`Please position the timeline within the current interval (frames ${startFrame}-${endFrame}), but not on the very first or last frame.`);
                return;
            }
            
            splitIntervalBtn.disabled = true;
            splitIntervalBtn.textContent = "Splitting...";
            try {
                const response = await fetch(`/split_interval/${taskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        interval_idx: currentIntervalIdx,
                        split_frame: splitFrame 
                    })
                });
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update the UI with the new intervals
                    intervals = data.new_intervals;
                    originalIntervals = JSON.parse(JSON.stringify(data.new_intervals));
                    
                    // Compute the index of the newly created second interval
                    const newSecondIdx = Math.min(intervals.length - 1, currentIntervalIdx + 1);
                    
                    // Show detailed success message and move to the second part for review
                    const firstPart = intervals[currentIntervalIdx];
                    const secondPart = intervals[newSecondIdx];
                    alert(`Successfully split the interval. The new intervals are: frames ${firstPart.frame_range[0]}-${firstPart.frame_range[1]} and frames ${secondPart.frame_range[0]}-${secondPart.frame_range[1]}.`);
                    console.log(`[Split]`, `Successfully split interval. New intervals: frames ${firstPart.frame_range[0]}-${firstPart.frame_range[1]} and frames ${secondPart.frame_range[0]}-${secondPart.frame_range[1]}.`);

                    // Jump to the first frame of the second interval
                    await loadInterval(newSecondIdx, false, false);
                    setTimelinePosition(Math.max(0, intervals[newSecondIdx].frame_range[0]));
                    populateSubtitlePlayer(intervals); // Refresh the subtitle player
                } else {
                    alert("Failed to split interval.");
                }
            } catch (e) {
                alert("An error occurred during splitting.");
                console.error("Split error:", e);
            } finally {
                splitIntervalBtn.disabled = false;
                splitIntervalBtn.textContent = "Split Current Interval";
            }
        };

        generateSubtitlesBtn.onclick = async () => {
            generateSubtitlesBtn.disabled = true;
            generateSubtitlesBtn.textContent = "Generating...";

            try {
                const response = await fetch(`/generate_subtitle_text/${taskId}`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error("Failed to start subtitle generation.");
                }

                // Now poll for completion
                const pollInterval = setInterval(async () => {
                    try {
                        const infoResponse = await fetch(`/task_info/${taskId}`);
                        const infoData = await infoResponse.json();

                        if (infoData.status === "Generation Complete") {
                            clearInterval(pollInterval);
                            generateSubtitlesBtn.textContent = "Subtitles Generated!";
                            generateSubtitlesBtn.style.display = 'none';
                            setAllControlsDisabled(false);
                            
                            // Re-fetch intervals to get the new text and repopulate the player
                            const intervalsResponse = await fetch(`/subtitle_intervals/${taskId}`);
                            const intervalsData = await intervalsResponse.json();
                            intervals = intervalsData.intervals;
                            originalIntervals = JSON.parse(JSON.stringify(intervalsData.intervals));
                            populateSubtitlePlayer(intervals);

                        } else if (infoData.status === "Generation Error") {
                            clearInterval(pollInterval);
                            alert(`Error generating subtitles: ${infoData.message}`);
                            generateSubtitlesBtn.disabled = false;
                            generateSubtitlesBtn.textContent = "Generate Subtitles";
                        } else {
                            // Update status for the user (optional, can show progress)
                            const progress = infoData.progress || 0;
                            generateSubtitlesBtn.textContent = `Generating... ${progress}%`;
                        }
                    } catch (pollError) {
                        clearInterval(pollInterval);
                        console.error("Polling error:", pollError);
                        alert("An error occurred while checking generation status.");
                        generateSubtitlesBtn.disabled = false;
                        generateSubtitlesBtn.textContent = "Generate Subtitles";
                    }
                }, 3000);

            } catch (error) {
                console.error("Error starting generation:", error);
                alert("Could not start subtitle generation process.");
                generateSubtitlesBtn.disabled = false;
                generateSubtitlesBtn.textContent = "Generate Subtitles";
            }
        };

        // --- SUBTITLE PLAYER FUNCTIONS ---
        // Rebuilds the subtitle list on the left-hand side. It now uses frames
        // from the main 'intervals' state, ensuring synchronization.
        function populateSubtitlePlayer(subtitles) {
            subtitlePlayer.innerHTML = ''; // Clear existing
            subtitles.forEach((sub, index) => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'subtitle-line';
                
                const frameSpan = document.createElement('span');
                frameSpan.className = 'subtitle-timestamp';
                // Display 1-based frame numbers
                frameSpan.textContent = `Frame: ${sub.frame_range[0] + 1} --> ${sub.frame_range[1] + 1}`;
                
                const textSpan = document.createElement('span');
                // Use a placeholder if text is empty
                textSpan.textContent = sub.text || '(No subtitle text generated)';

                lineDiv.appendChild(frameSpan);
                lineDiv.appendChild(textSpan);

                lineDiv.onclick = () => onSubtitleClick(sub.frame_range[0]);
                subtitlePlayer.appendChild(lineDiv);
            });
        }

        function onSubtitleClick(frame) {
            // Seeks the video to the start frame of the clicked interval.
            // A small time offset is added to ensure we land on the correct frame.
            const targetTime = (frame / taskInfo.fps) + (1 / (taskInfo.fps * 2));
            video.currentTime = targetTime;
            
            // Immediately load the interval to update controls without waiting for draw loop
            const clickedIdx = findActiveInterval(frame);
            if (clickedIdx !== -1 && clickedIdx !== currentIntervalIdx) {
                loadInterval(clickedIdx, true);
            }
        }

        // --- START THE APPLICATION ---
        
        // Kick off the entire process when the page first loads.
        initializeEditor();
    </script>
</body>
