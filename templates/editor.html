<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Box Editor</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f4f7f6;
            --editor-bg-color: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .editor-header {
            text-align: center;
        }
        .editor-main {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-container {
            position: relative;
            max-width: 800px;
            flex-grow: 1;
            min-width: 300px;
        }
        #preview-canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #e9ecef;
        }
        .controls {
            background-color: var(--editor-bg-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .slider-group {
            display: grid;
            grid-template-columns: 50px 1fr 40px;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] { width: 100%; }
        .navigation { display: flex; justify-content: space-between; }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background-color: #357abd; }
        #finish-btn { background-color: #28a745; }
        #finish-btn:hover:not(:disabled) { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor-header">
            <h1>Subtitle Box Editor</h1>
            <h3 id="interval-info">Loading...</h3>
        </div>
        <div class="editor-main">
            <div class="preview-container">
                <canvas id="preview-canvas"></canvas>
            </div>
            <div class="controls">
                <div class="slider-group">
                    <label for="x-slider">X:</label>
                    <input type="range" id="x-slider" name="x">
                    <span id="x-value"></span>
                </div>
                <div class="slider-group">
                    <label for="y-slider">Y:</label>
                    <input type="range" id="y-slider" name="y">
                    <span id="y-value"></span>
                </div>
                <div class="slider-group">
                    <label for="width-slider">Width:</label>
                    <input type="range" id="width-slider" name="width">
                    <span id="width-value"></span>
                </div>
                <div class="slider-group">
                    <label for="height-slider">Height:</label>
                    <input type="range" id="height-slider" name="height">
                    <span id="height-value"></span>
                </div>
                <div class="navigation">
                    <button id="prev-btn">Previous</button>
                    <button id="next-btn">Next</button>
                </div>
                <button id="finish-btn">Finish and Process</button>
            </div>
        </div>
    </div>

    <script>
        // --- INITIALIZATION ---
        // Get the unique task ID from the URL (e.g., /editor/some-uuid-goes-here)
        const taskId = window.location.pathname.split('/').pop();
        
        // Global variables to hold the state of the editor
        let intervals = []; // All subtitle intervals from the server
        let taskInfo = {};  // Video metadata like width and height
        let currentIntervalIdx = 0; // The index of the interval we are currently editing
        let debounceTimer; // A timer to prevent spamming the API while moving sliders
        let currentImage = new Image(); // An image object to hold the current raw video frame

        // Get references to all the HTML elements we will interact with
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const intervalInfo = document.getElementById('interval-info');
        const sliders = {
            x: document.getElementById('x-slider'),
            y: document.getElementById('y-slider'),
            width: document.getElementById('width-slider'),
            height: document.getElementById('height-slider')
        };
        const values = {
            x: document.getElementById('x-value'),
            y: document.getElementById('y-value'),
            width: document.getElementById('width-value'),
            height: document.getElementById('height-value')
        };
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // This is the main function that runs when the page loads.
        // It fetches all necessary data from the server to set up the editor.
        async function initializeEditor() {
            try {
                // Fetch both the interval data and the video metadata at the same time.
                const [intervalsResponse, infoResponse] = await Promise.all([
                    fetch(`/subtitle_intervals/${taskId}`), // Gets all subtitle boxes and frame ranges
                    fetch(`/task_info/${taskId}`)         // Gets video width and height for sliders
                ]);
                const intervalsData = await intervalsResponse.json();
                const infoData = await infoResponse.json();
                
                // Store the fetched data in our global variables
                intervals = intervalsData.intervals;
                taskInfo = infoData;
                
                // Load the first interval into the editor UI
                await loadInterval(currentIntervalIdx);
            } catch (error) {
                console.error("Failed to initialize editor:", error);
                intervalInfo.textContent = "Error loading task. Please try again.";
            }
        }

        // --- CORE EDITOR LOGIC ---

        // This function updates the entire UI for a specific subtitle interval.
        async function loadInterval(idx) {
            currentIntervalIdx = idx;
            const interval = intervals[idx];
            intervalInfo.textContent = `Editing Interval ${idx + 1} / ${intervals.length} (Frames ${interval.frame_range[0]}-${interval.frame_range[1]})`;
            
            // Convert the server's [xmin, xmax, ymin, ymax] format to the UI's {x, y, width, height} format
            const [xmin, xmax, ymin, ymax] = interval.coords;
            const currentBox = {
                x: xmin,
                y: ymin,
                width: xmax - xmin,
                height: ymax - ymin
            };

            // Set up the sliders with the correct max values and current positions
            updateSliderRanges();
            updateSliderValues(currentBox);

            // Fetch the raw video frame for this interval from the server
            await loadFrameImage(interval.frame_range[0]);

            // Enable/disable the "Previous" and "Next" buttons appropriately
            prevBtn.disabled = currentIntervalIdx === 0;
            nextBtn.disabled = currentIntervalIdx === intervals.length - 1;
        }

        // Sets the maximum value of the sliders based on the video's dimensions
        function updateSliderRanges() {
            sliders.x.max = taskInfo.video_width;
            sliders.y.max = taskInfo.video_height;
            sliders.width.max = taskInfo.video_width;
            sliders.height.max = taskInfo.video_height;
        }
        
        // Sets the current value (position) of the sliders and updates the text display next to them
        function updateSliderValues(box) {
            for (const key in sliders) {
                sliders[key].value = box[key];
                values[key].textContent = box[key];
            }
        }

        // --- RENDERING AND PREVIEW ---

        // Fetches a single, clean video frame from the server (with no box drawn on it).
        async function loadFrameImage(frameIdx) {
            // Calls the API to get the raw image data
            const response = await fetch(`/show_subtitle_box/${taskId}?frame_idx=${frameIdx}&draw_box=false`);
            const imageBlob = await response.blob();
            // When the image data has loaded into our image object, redraw the canvas.
            currentImage.onload = () => {
                redrawCanvas();
            };
            currentImage.src = URL.createObjectURL(imageBlob);
        }

        // This is the core of the real-time preview. It redraws everything on the canvas.
        function redrawCanvas() {
            // Don't do anything if the image isn't fully loaded yet
            if (!currentImage.complete || currentImage.naturalWidth === 0) return;
            
            // Set the canvas size to match the image's actual size
            canvas.width = currentImage.naturalWidth;
            canvas.height = currentImage.naturalHeight;
            
            // Clear the canvas and draw the background video frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);
            
            // Get the current positions of the sliders
            const box = {
                x: parseInt(sliders.x.value),
                y: parseInt(sliders.y.value),
                width: parseInt(sliders.width.value),
                height: parseInt(sliders.height.value)
            };
            // Draw the green bounding box on top of the video frame
            drawBoundingBox(box);
        }

        // A simple utility function to draw a rectangle on the canvas.
        function drawBoundingBox(box) {
            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 2;
            ctx.strokeRect(box.x, box.y, box.width, box.height);
        }
        
        // --- HANDLING USER INPUT AND SAVING ---

        // This function is called every time a slider is moved.
        function handleSliderInput() {
            // Get the current values from all sliders
            const box = {
                x: parseInt(sliders.x.value),
                y: parseInt(sliders.y.value),
                width: parseInt(sliders.width.value),
                height: parseInt(sliders.height.value)
            };
            // Update the text display next to each slider
            for(const key in values) {
                values[key].textContent = box[key];
            }
            
            // Redraw the canvas to provide instant visual feedback
            redrawCanvas();

            // Use a debounce timer to avoid spamming the server.
            // This waits for the user to stop moving the slider for 200ms before saving.
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                saveBox(box);
            }, 200);
        }

        // Sends the updated box coordinates to the server to be stored.
        async function saveBox(box) {
            // Update the coordinates in our local 'intervals' array first
            intervals[currentIntervalIdx].coords = [box.x, box.x + box.width, box.y, box.y + box.height];
            // Send the new data to the /adjust_box endpoint
            await fetch(`/adjust_box/${taskId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ interval_idx: currentIntervalIdx, ...box })
            });
        }

        // --- EVENT LISTENERS ---

        // Attach the handleSliderInput function to all sliders.
        for (const key in sliders) {
            sliders[key].oninput = handleSliderInput;
        }

        // Attach the navigation functions to the Previous/Next buttons.
        prevBtn.onclick = () => loadInterval(currentIntervalIdx - 1);
        nextBtn.onclick = () => loadInterval(currentIntervalIdx + 1);

        // This function is called when the user clicks the "Finish and Process" button.
        finishBtn.onclick = async () => {
            finishBtn.disabled = true;
            finishBtn.textContent = "Processing...";
            try {
                // Tell the server to start the final video processing job
                const response = await fetch(`/process_task/${taskId}`, { method: 'POST' });
                if (response.ok) {
                    const data = await response.json();
                    alert("Processing started! Your download will begin when ready.");
                    // Redirect the user's browser to the download URL for the finished video
                    window.location.href = data.download_url;
                } else {
                    alert("Failed to start processing.");
                    finishBtn.disabled = false;
                    finishBtn.textContent = "Finish and Process";
                }
            } catch (e) {
                alert("An error occurred.");
                finishBtn.disabled = false;
                finishBtn.textContent = "Finish and Process";
            }
        };

        // --- START THE APPLICATION ---
        
        // Kick off the entire process when the page first loads.
        initializeEditor();
    </script>
</body>
</html>
